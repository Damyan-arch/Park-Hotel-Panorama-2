# DigitalOcean App Platform spec for Park Hotel Panorama.
# Import via: App Platform → Create App → "Edit Your App Spec" (or `doctl apps create --spec .do/app.yaml`).
# After creating a Managed Postgres database and a Space in the DO control panel,
# fill in the SECRET-marked values below (App Platform's UI prompts for these on import).

name: park-hotel-panorama
region: nyc

envs:
  - key: DB_HOST
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: DB_PORT
    scope: RUN_AND_BUILD_TIME
    value: "25060" # DigitalOcean Managed Postgres' default port — confirm on the database's "Connection Details" page
  - key: DB_NAME
    scope: RUN_AND_BUILD_TIME
    value: park_hotel_panorama
  - key: DB_USER
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: DB_PASSWORD
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: DB_SSL
    scope: RUN_AND_BUILD_TIME
    value: "true"
  - key: ADMIN_EMAILS
    scope: RUN_TIME
  - key: ADMIN_PASSWORD
    scope: RUN_TIME
    type: SECRET
  - key: FRONTEND_ORIGIN
    scope: RUN_TIME
  - key: DEEPL_API_KEY
    scope: RUN_TIME
    type: SECRET
  - key: SPACES_REGION
    scope: RUN_TIME
  - key: SPACES_BUCKET
    scope: RUN_TIME
  - key: SPACES_KEY
    scope: RUN_TIME
    type: SECRET
  - key: SPACES_SECRET
    scope: RUN_TIME
    type: SECRET
  - key: SPACES_CDN_ENDPOINT
    scope: RUN_TIME

services:
  - name: web
    github:
      repo: Damyan-arch/Park-Hotel-Panorama-2
      branch: main
      deploy_on_push: true
    source_dir: /
    build_command: npm install --prefix Frontend && npm run build --prefix Frontend && npm install --prefix Backend
    run_command: npm start --prefix Backend
    environment_slug: node-js
    instance_size_slug: basic-xxs
    instance_count: 1
    http_port: 8080
    health_check:
      http_path: /api

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: Damyan-arch/Park-Hotel-Panorama-2
      branch: main
    source_dir: /Backend
    build_command: npm install
    run_command: npm run db:migrate
